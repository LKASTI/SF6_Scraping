name: SF6 Ranked Data Scraper

on:
  schedule:
    # Run at 7:15 PM CST (1:15 AM UTC)
    - cron: '35 1 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Modify file path in script
      run: |
        # Replace the Windows file path with a path that works in GitHub Actions
        sed -i 's|C:\\\\Users\\\\LKASTI\\\\OneDrive\\\\UTD\\\\Coding Workspaces\\\\VS code Python\\\\my_programs\\\\labbinglegends_helpers\\\\rankedData\\\\|./data/|g' SF6_Scraper.py
        
    - name: Create data directory
      run: mkdir -p ./data
        
    - name: Run web scraper
      run: python SF6_Scraper.py
      
    - name: Commit and push if there are changes
      run: |
        git config --local user.email "lkastiman@gmail.com"
        git config --local user.name "LKASTI"
        git add ./data/
        git diff --quiet && git diff --staged --quiet || git commit -m "Update ranking data $(date +'%Y-%m-%d')"
        git push
